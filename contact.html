<!doctype html>
<html lang="en">
  <head>
    <!-- Website information -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website title -->
    <title>Contact | Javairia Bibi</title>

    <!-- Font Awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navigation bar -->
    <header>
      <nav class="navbar">
        <!-- Website logo -->
        <h2 class="logo">
          <i class="fa-solid fa-code"></i>
          Javairia Bibi
        </h2>

        <!-- Navigation links -->
        <ul>
          <li>
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
          </li>
          <li>
            <a href="about.html"><i class="fa-solid fa-user"></i> About</a>
          </li>
          <li>
            <a href="skills.html"><i class="fa-solid fa-gears"></i> Skills</a>
          </li>
          <li>
            <a href="projects.html"
              ><i class="fa-solid fa-briefcase"></i> Projects</a
            >
          </li>
          <li>
            <a href="contact.html"
              ><i class="fa-solid fa-envelope"></i> Contact</a
            >
          </li>
        </ul>

        <!-- Login and Signup buttons -->
        <div>
          <a href="login.html" class="btn">
            <i class="fa-solid fa-user-lock"></i> Login
          </a>

          <a href="signup.html" class="btn">
            <i class="fa-solid fa-user-plus"></i> Sign Up
          </a>
        </div>
      </nav>
    </header>

    <!-- Main contact section -->
    <section class="page contact-page">
      <!-- Page heading -->
      <h1 class="about-heading">
        <i class="fa-solid fa-envelope heading-icon"></i>
        Contact <span>Me</span>
      </h1>

      <!-- Contact introduction -->
      <p class="contact-intro">
        Have a question or want to work together? Feel free to contact me.
      </p>

      <!-- Contact information cards -->
      <div class="contact-container">
        <!-- Email card -->
        <div class="contact-card">
          <i class="fa-solid fa-envelope contact-icon"></i>
          <h2>Email Address</h2>
          <p>javeriabibi201@gmail.com</p>
        </div>

        <!-- Phone card -->
        <div class="contact-card">
          <i class="fa-solid fa-phone contact-icon"></i>
          <h2>Phone Number</h2>
          <p>0341-5660355</p>
        </div>

        <!-- Location card -->
        <div class="contact-card">
          <i class="fa-solid fa-location-dot contact-icon"></i>
          <h2>Location</h2>
          <p>Mardan, KPK, Pakistan</p>
        </div>
      </div>

      <!-- Contact form section -->
      <div class="contact-form-container">
        <!-- Form heading -->
        <h2>
          <i class="fa-solid fa-paper-plane heading-icon"></i>
          Send Me a Message
        </h2>

        <!-- Contact form -->
        <form id="contactForm">
          <!-- Name input -->
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />

          <!-- Email input -->
          <label for="email">Your Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />

          <!-- Message input -->
          <label for="message">Your Message</label>
          <textarea
            id="message"
            placeholder="Write your message"
            rows="5"
            required
          ></textarea>

          <!-- Submit button -->
          <button type="submit" class="btn">
            <i class="fa-solid fa-paper-plane"></i>
            Send Message
          </button>
        </form>

        <!-- Form response message -->
        <p id="formMessage"></p>
      </div>
    </section>

    <!-- JavaScript file -->
    <script src="js/script.js"></script>
  </body>
</html>
